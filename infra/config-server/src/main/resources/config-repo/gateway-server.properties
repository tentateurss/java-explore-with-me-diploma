spring.cloud.gateway.routes[0].id=requests-route
spring.cloud.gateway.routes[0].uri=lb://request-service
spring.cloud.gateway.routes[0].order=-100
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/*/requests,/users/*/requests/**,/users/*/events/*/requests,/users/*/events/*/requests/**

spring.cloud.gateway.routes[1].id=subscriptions-route
spring.cloud.gateway.routes[1].uri=lb://subscription-service
spring.cloud.gateway.routes[1].order=-90
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/*/subscriptions,/users/*/subscriptions/**,/users/*/subscribers,/users/*/subscribers/**

spring.cloud.gateway.routes[2].id=users-route
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].order=-80
spring.cloud.gateway.routes[2].predicates[0]=Path=/admin/users,/admin/users/**

spring.cloud.gateway.routes[3].id=stats-route
spring.cloud.gateway.routes[3].uri=lb://stats-server
spring.cloud.gateway.routes[3].order=-70
spring.cloud.gateway.routes[3].predicates[0]=Path=/stats,/hit

spring.cloud.gateway.routes[4].id=events-route
spring.cloud.gateway.routes[4].uri=lb://event-service
spring.cloud.gateway.routes[4].order=-10
spring.cloud.gateway.routes[4].predicates[0]=Path=/events,/events/**,/categories,/categories/**,/compilations,/compilations/**,/admin/events,/admin/events/**,/admin/categories,/admin/categories/**,/admin/compilations,/admin/compilations/**,/users/*/events,/users/*/events/**
