server.port=${SERVER_PORT:8084}
spring.application.name=request-service

spring.datasource.username=${REQUEST_DB_USERNAME:request_user}
spring.datasource.password=${REQUEST_DB_PASSWORD:request_password}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}

spring.config.import=optional:configserver:
spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server
