server.port=${SERVER_PORT:8083}
spring.application.name=subscription-service

spring.datasource.username=${SUBSCRIPTION_DB_USERNAME:subscription_user}
spring.datasource.password=${SUBSCRIPTION_DB_PASSWORD:subscription_password}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}

spring.config.import=optional:configserver:
spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server
