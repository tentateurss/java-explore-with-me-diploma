
name: ewm-spring-cloud

services:
  discovery-server:
    build:
      context: ./infra/discovery-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"

  config-server:
    build:
      context: ./infra/config-server
      dockerfile: Dockerfile
    depends_on:
      - discovery-server
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats_user
      POSTGRES_PASSWORD: stats_password
    volumes:
      - stats_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats_user -d stats"]
      interval: 10s
      timeout: 5s
      retries: 5

  stats-server:
    build:
      context: ./ewm-stats-service
      dockerfile: Dockerfile
    depends_on:
      stats-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: stats_user
      SPRING_DATASOURCE_PASSWORD: stats_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  user-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_password
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d users"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./core/user-service
      dockerfile: Dockerfile
    ports:
      - "18081:8081"
    depends_on:
      user-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      SERVER_PORT: "8081"
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/users
      SPRING_DATASOURCE_USERNAME: user_user
      SPRING_DATASOURCE_PASSWORD: user_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  gateway-server:
    build:
      context: ./infra/gateway-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
      - config-server
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

  event-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_password
    volumes:
      - event_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d events"]
      interval: 10s
      timeout: 5s
      retries: 5

  event-service:
    build:
      context: ./core/event-service
      dockerfile: Dockerfile
    ports:
      - "18082:8082"
    depends_on:
      event-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      SERVER_PORT: "8082"
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/events
      SPRING_DATASOURCE_USERNAME: event_user
      SPRING_DATASOURCE_PASSWORD: event_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  subscription-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: subscriptions
      POSTGRES_USER: subscription_user
      POSTGRES_PASSWORD: subscription_password
    volumes:
      - subscription_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscription_user -d subscriptions"]
      interval: 10s
      timeout: 5s
      retries: 5

  subscription-service:
    build:
      context: ./core/subscription-service
      dockerfile: Dockerfile
    ports:
      - "18083:8083"
    depends_on:
      subscription-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      SERVER_PORT: "8083"
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://subscription-db:5432/subscriptions
      SPRING_DATASOURCE_USERNAME: subscription_user
      SPRING_DATASOURCE_PASSWORD: subscription_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  request-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: requests
      POSTGRES_USER: request_user
      POSTGRES_PASSWORD: request_password
    volumes:
      - request_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U request_user -d requests"]
      interval: 10s
      timeout: 5s
      retries: 5

  request-service:
    build:
      context: ./core/request-service
      dockerfile: Dockerfile
    ports:
      - "18084:8084"
    depends_on:
      request-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      SERVER_PORT: "8084"
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://request-db:5432/requests
      SPRING_DATASOURCE_USERNAME: request_user
      SPRING_DATASOURCE_PASSWORD: request_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  request_pgdata:
  subscription_pgdata:
  event_pgdata:
  user_pgdata:
  ewm_pgdata:
  stats_pgdata:
